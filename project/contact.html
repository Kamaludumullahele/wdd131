<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="This website provides information of tourist attractions and interactive tools to help tourists plan their visit to Sri Lanka.">
    <meta name="author" content="Kamal Udumulla Hele">
    <title>Explore Sri Lanka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="project-large.css">
    <script src="project.js" defer></script>
</head>

<body>
    <header>
        <div class="header-bar">
            <a class="logo" href="project.html">LOGO</a>
            <div class="site-title">
                <h1>Contact Us</h1>
            </div>
        </div>
        <nav id="mainNav" aria-label="Main navigation">
            <ul>
                <li><a href="project.html">Home</a></li>
                <li><a href="traveltips.html">Travel Tips</a></li>
                <li><a href="planyourtrip.html">Plan Your Trip</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>If you have any questions or feedback, please reach out to us using the form below.</p>
        </section>

        <section>
            <h2>Send a Message</h2>
            <form id="contactForm" action="#" method="post">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <fieldset class="form-group">
                        <legend>Subject</legend>
                        <label class="radio-option">
                            <input type="radio" name="subject" value="question" required>
                            General question
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="subject" value="feedback">
                            Feedback
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="subject" value="trip">
                            Trip planning help
                        </label>
                    </fieldset>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="button">Send Message</button>
                <p id="formStatus" role="status"></p>
            </form>
        </section>


    </main>
    <footer>
        <p>copyright &copy; <span id="currentyear"></span> Explore Sri Lanka</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
