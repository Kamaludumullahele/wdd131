<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Building a HTML form with a confirmation page following best HTML,CSS and JavaScript practices">
    <meta name="author" content="Kamal Udumulla Hele">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
    <title>Product Review Form</title>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form class="review-form" action="review.html" method="get">
            <div class="form-field">
                <label class="field-title" for="product">Product Name</label>
                <select name="Product" id="product" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                    
                </select>
            </div>

            <fieldset class="rating-field">
                <legend>Overall Rating</legend>
                <div class="rating-options">
                    <label><span aria-hidden="true">&#9734;</span><input type="radio" name="rating" value="1"
                            required><span class="visually-hidden">1 star</span></label>
                    <label><span aria-hidden="true">&#9734;&#9734;</span><input type="radio" name="rating"
                            value="2"><span class="visually-hidden">2 stars</span></label>
                    <label><span aria-hidden="true">&#9734;&#9734;&#9734;</span><input type="radio" name="rating"
                            value="3"><span class="visually-hidden">3 stars</span></label>
                    <label><span aria-hidden="true">&#9734;&#9734;&#9734;&#9734;</span><input type="radio" name="rating"
                            value="4"><span class="visually-hidden">4 stars</span></label>
                    <label><span aria-hidden="true">&#9734;&#9734;&#9734;&#9734;&#9734;</span><input type="radio"
                            name="rating" value="5"><span class="visually-hidden">5 stars</span></label>
                </div>
            </fieldset>

            <div class="form-field">
                <label class="field-title" for="date">Date of Installation</label>
                <input type="date" id="date" name="date" required>
            </div>

            <fieldset class="feature-field">
                <legend>Which features did you find useful in the product?</legend>
                <p class="hint">(Check all that apply)</p>
                <label><input type="checkbox" name="durability" value="yes">Durability</label>
                <label><input type="checkbox" name="ease-of-use" value="yes">Ease of Use</label>
                <label><input type="checkbox" name="performance" value="yes">Performance</label>
                <label><input type="checkbox" name="design" value="yes">Design</label>
            </fieldset>

            <div class="form-field">
                <label class="field-title" for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea name="review" id="review"></textarea>
            </div>

            <div class="form-field">
                <label class="field-title" for="user-name">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" name="user-name" id="user-name">
            </div>

            <button type="submit">Post Your Review</button>
        </form>
    </main>
    <footer>
        <p>Copyright &copy; <span id="currentyear"></span> Kamal Udumullahele | Canada</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
