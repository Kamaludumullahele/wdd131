<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Building a HTML form with a confirmation page following best HTML,CSS and JavaScript practices">
    <meta name="author" content="Kamal Udumulla Hele">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
    <title>Product Review Form</title>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form class="review-form" action="review.html" method="get">
            <div class="form-field">
                <label class="field-title" for="product">Product Name</label>
                <select name="Product" id="product" required>
                    <option value="" disabled selected>Select a Product ...</option>

                </select>
            </div>

            <fieldset class="rating-field">
                <legend>Overall Rating</legend>
                <div class="rating-options">
                    <label for="rating-1"><span aria-hidden="true">&#9734;</span><input type="radio" id="rating-1"
                            name="rating" value="1" required></label>
                    <label for="rating-2"><span aria-hidden="true">&#9734;&#9734;</span><input type="radio"
                            id="rating-2" name="rating" value="2" required></label>
                    <label for="rating-3"><span aria-hidden="true">&#9734;&#9734;&#9734;</span><input type="radio"
                            id="rating-3" name="rating" value="3" required></label>
                    <label for="rating-4"><span aria-hidden="true">&#9734;&#9734;&#9734;&#9734;</span><input
                            type="radio" id="rating-4" name="rating" value="4" required></label>
                    <label for="rating-5"><span aria-hidden="true">&#9734;&#9734;&#9734;&#9734;&#9734;</span><input
                            type="radio" id="rating-5" name="rating" value="5" required></label>

                </div>
            </fieldset>

            <div class="form-field">
                <label class="field-title" for="date">Date of Installation</label>
                <label><input type="date" id="date" name="date" required></label>
            </div>

            <fieldset class="feature-field">
                <legend>Which features did you find useful in the product?</legend>
                <p class="hint">(Check all that apply)</p>
                <input type="checkbox" id="durability" name="durability" value="yes">
                <label for="durability">Durability</label>
                <input type="checkbox" id="ease-of-use" name="ease-of-use" value="yes">
                <label for="ease-of-use">Ease of Use</label>
                <input type="checkbox" id="performance" name="performance" value="yes">
                <label for="performance">Performance</label>
                <input type="checkbox" id="design" name="design" value="yes">
                <label for="design">Design</label>
            </fieldset>

            <div class="form-field">
                <label class="field-title" for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea name="review" id="review"></textarea>
            </div>

            <div class="form-field">
                <label class="field-title" for="user-name">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" name="user-name" id="user-name">
            </div>

            <button type="submit">Post Your Review</button>
        </form>
    </main>
    <footer>
        <p>Copyright &copy; <span id="currentyear"></span> Kamal Udumullahele | Canada</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
